<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Snake Game</h1>
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="high-score">High Score: <span id="high-score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Mobile touch controls -->
        <div class="mobile-controls">
            <div class="dpad">
                <button id="upBtn" class="dpad-btn up">▲</button>
                <div class="dpad-middle">
                    <button id="leftBtn" class="dpad-btn left">◄</button>
                    <div class="dpad-center"></div>
                    <button id="rightBtn" class="dpad-btn right">►</button>
                </div>
                <button id="downBtn" class="dpad-btn down">▼</button>
            </div>
        </div>

        <div class="controls">
            <p class="desktop-hint">Use Arrow Keys or Swipe to control the snake</p>
            <button id="startBtn">Start Game</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
        <div class="game-status" id="gameStatus"></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
